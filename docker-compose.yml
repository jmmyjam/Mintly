services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      retries: 5

  api:
    build: ./Backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      # Caddy always fronts the api and sets X-Forwarded-For
      RATE_LIMIT_TRUST_FORWARDED: "1"
    volumes:
      # cold-storage price history: compaction deletes DB rows only after the
      # CSV lands here, so this must outlive container rebuilds
      - ./Backend/.archive:/app/.archive
      # proxy-fallback response cache disk mirror (warm cache across restarts)
      - ./Backend/.cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Frontend/mintly/dist:/srv:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
